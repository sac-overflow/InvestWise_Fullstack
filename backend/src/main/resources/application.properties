spring.application.name=backend

# ----------------------------------------------------
# H2 In-Memory Database Configuration (Default)
# ----------------------------------------------------
spring.datasource.url=jdbc:h2:mem:investwisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ----------------------------------------------------
# Oracle Database Configuration (Future Migration)
# ----------------------------------------------------
# spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
# spring.datasource.driverClassName=oracle.jdbc.OracleDriver
# spring.datasource.username=investwise_user
# spring.datasource.password=your_secure_password
# spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ----------------------------------------------------
# JPA / Hibernate Settings
# ----------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.port=8080
